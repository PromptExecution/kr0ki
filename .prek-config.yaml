# prek configuration
# See: https://github.com/j178/prek

repos:
  # Local valigate hooks
  - repo: local
    hooks:
      # Valigate: validate + gate + date
      - id: valigate
        name: valigate (validate + gate + date)
        entry: ./scripts/valigate.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Rust formatting
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]

      # Rust linting
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]

      # Rust tests
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]

      # Requirements validation
      - id: validate-requirements
        name: validate requirements
        entry: ./scripts/validate-requirements.sh
        language: script
        pass_filenames: true
        files: 'docs/requirements/.*\.md$'
        stages: [pre-commit]

      # Version sync check
      - id: version-sync
        name: version sync
        entry: ./scripts/check-version-sync.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
