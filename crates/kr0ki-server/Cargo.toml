[package]
name = "kr0ki-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kr0ki P0 HTTP service — POST /render (Kroki-family text -> SVG), content-addressed cache, /health."

[[bin]]
name = "kr0ki"
path = "src/main.rs"

[dependencies]
uuid = { workspace = true }
kr0ki-core = { path = "../kr0ki-core" }
kr0ki-sysmlv2-client = { path = "../kr0ki-sysmlv2-client" }
kr0ki-svg = { path = "../kr0ki-svg" }
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true }
futures-util = "0.3"
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# POST /render/kubediagram proxies to the kr0ki-mcp sidecar's internal
# http_worker.py listener — mcp-http-parity design, 2026-09-16.
reqwest = { workspace = true }
# POST /render/k8s-topology parses a multi-doc YAML manifest bundle into
# the JSON k8s_recognizer::KubernetesRecognizer::recognize expects.
serde_yaml = "0.9"
sha2 = { workspace = true }
hmac = "0.12"
thiserror.workspace = true
toml = "0.8"
# The assurance profile types the /assurance routes and the gateway use (same pin as kr0ki-core).
ufo-types = { git = "https://github.com/PromptExecution/ufo-types", rev = "db8e22fc2c09ff1b58cc4effce6096d17a89f3e4" }

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Mocks the kubediagram worker's HTTP responses in render_kubediagram tests.
wiremock = "0.6"
