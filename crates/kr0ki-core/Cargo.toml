[package]
name = "kr0ki-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kr0ki P0 render loop — Kroki-family text to SVG, content-addressed cache — plus box-2 UFO-graph builders for the SysML-v2 and Kubernetes arms (PLAN-KR0KI-002), and the b00t-graph Turtle -> holon-viz -> D2 route (kr0ki#13)."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true }
sha2.workspace = true
tokio = { workspace = true }
reqwest = { workspace = true }
tracing.workspace = true
syn = { version = "2", features = ["full", "parsing", "visit"] }
serde_json = { workspace = true }
quote = "1"
walkdir = "2"
resvg = "0.48.1"
usvg = "0.48.1"
tiny-skia = "0.12.0"
kr0ki-sysmlv2-client = { path = "../kr0ki-sysmlv2-client" }
# Box 2 of the five-box ingestion pipeline (PLAN-KR0KI-002 §2): the canonical
# UFO-typed semantic graph. Pinned to an exact tag, per this crate's own
# CHANGELOG guidance ("pin an exact version or a git tag"). `ontology` /
# `sysml_model` / `view` are default (not feature-gated) — no extra features
# needed here.
# PR #43's rev pin (a1f6a89) pointed at a feature-branch tip that no longer
# exists after ufo-types#29's squash-merge into main (2026-09-20). Re-pinned
# to that merge commit on main -- bump to a `tag =` pin once ufo-types cuts
# a release past v0.15.0 including it.
ufo-types = { git = "https://github.com/PromptExecution/ufo-types", rev = "ee873488f31a390073d5f8ab38d91654a3504bfa", features = ["reqif"] }
# kr0ki#13 — box 5 (b00t-graph Turtle -> D2 route): the typed TypeRelationshipGraph /
# CytoscapeGraph the D2 emitter targets. No tagged release exists yet (checked
# 2026-09-16); pinned by git rev per this issue's own operator decision, to be
# swapped for a version req once holon-viz cuts a 0.x tag.
holon-viz = { git = "https://github.com/PromptExecution/ledgrrr", rev = "3e9e3f415177e17b8e83eb1edae9d17d14a0a8e9" }
# Turtle RDF parsing for the b00t-graph artifact (kr0ki#13) — the standalone
# oxigraph-project parser, not the full Oxigraph store (no query engine needed
# here, just SPO triples).
oxttl = "0.2"
oxrdf = "0.3"
# Box 1's cross-crate `requires` slice (rust_recognizer.rs, PATTERNS-rust-
# source.md #5): reads workspace Cargo.toml files to tell a workspace-sibling
# crate apart from a genuine external dependency.
toml = "0.8"
# M2 (docs/TODO.md "ReqIF / ReqIFz adapter"): ReqIF 1.2 XML parsing + the
# ReqIfBundle -> RequirementGraph adapter moved into `ufo_types::reqif`
# (2026-09-20, `docs/DESIGN-NOTE-versioned-dialects-and-b00t-loader.md` §3) --
# enabled via the `reqif` feature above. `ufo_types::reqif` still needs no
# direct `reqrs` dependency here for the *import* path; this crate's own
# bytes-in boundary only owns bounded-bytes acquisition (size/entry-count
# limits, hashing, the HTTP/MCP envelope), not parsing. As of M3, though,
# `kr0ki_core::reqif_export` (src/reqif_export.rs) *does* need `reqrs`
# directly for the *export* path -- see that dependency's own comment below
# and reqif_export.rs's module doc comment for why.
# ReqIFz is a ZIP container.  kr0ki reads archives in-memory so the import
# boundary can enforce its own compressed and expanded byte limits before
# retaining any attachment metadata.
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
# M3 (docs/superpowers/specs/2026-09-23-flexo-baseline-adapter-design.md):
# reqif_export needs reqrs::{model, unparse} directly to build and
# serialize a ReqIfBundle for the export direction -- ufo_types::reqif
# deliberately narrows its own scope to the import lowering only (see
# that module's doc comment). Promotes the existing transitive pull
# (via ufo-types' `reqif` feature) to direct; adds no new supply-chain
# surface. Unlike regorus (feat/requirements-rules-system), reqrs has
# no [features] table at all -- nothing to disable.
reqrs = "0.2.2"
# docs/superpowers/specs/2026-09-22-requirements-rules-system-design.md §4:
# embedded, pure-Rust Rego/OPA evaluation for rule documents (RuleBackend /
# RegorusBackend, rule_eval.rs) -- no Python sidecar, same "direct Rust
# dependency" precedent the ReqIF work already set.
regorus = "0.12.0"


[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "fs", "net", "rt-multi-thread"] }
# Phase 1 SysML-v2 conformance harness (tests/conformance.rs): gate kr0ki's
# SysML-v2 handling against the OMG SysML-v2-Release corpus by consuming this
# pure-Rust parser rather than reimplementing one.
sysml-v2-parser = "0.55"
# kr0ki#12 checklist item 5 (tests/kubediagrams_oracle.rs): parse the vendored
# KubeDiagrams example manifests (multi-doc YAML) to diff kr0ki's Kubernetes
# recognizer against a real, already-vendored KubeDiagrams `dot_json` oracle.
serde_yaml = "0.9"
# kr0ki#18 (src/probe.rs): mock a Kroki backend's /health + /{slug}/svg
# responses without a live network dependency in the unit tests.
wiremock = "0.6"
