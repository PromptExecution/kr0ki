[package]
name = "kr0ki-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kr0ki P0 render loop — Kroki-family text to SVG, content-addressed cache. No SysML-model path (blocked on PRD-KR0KI-001 §5)."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true }
sha2.workspace = true
tokio = { workspace = true }
reqwest = { workspace = true }
tracing.workspace = true
syn = { version = "2", features = ["full", "parsing", "visit"] }
serde_json = { workspace = true }
quote = "1"
walkdir = "2"
resvg = "0.48.1"
usvg = "0.48.1"
tiny-skia = "0.12.0"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "fs", "net", "rt-multi-thread"] }
# Phase 1 SysML-v2 conformance harness (tests/conformance.rs): gate kr0ki's
# SysML-v2 handling against the OMG SysML-v2-Release corpus by consuming this
# pure-Rust parser rather than reimplementing one.
sysml-v2-parser = "0.55"
