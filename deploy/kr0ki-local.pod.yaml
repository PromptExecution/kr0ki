apiVersion: v1
kind: Pod
metadata:
  name: kr0ki-local
  namespace: kr0ki
  labels:
    app.kubernetes.io/name: kr0ki
    app.kubernetes.io/part-of: b00tyverse
spec:
  restartPolicy: Always
  containers:
    - name: kroki
      image: localhost/kr0ki-kroki-compat:dev
      imagePullPolicy: Never
      env:
        - name: KROKI_SAFE_MODE
          value: secure
        # kr0ki#20 — copy the build-time-computed capabilities.json (baked
        # into the image) to this shared volume at container start, so
        # kr0ki-server (a separate container/filesystem) can read it.
        - name: KR0KI_CAPABILITIES_PATH
          value: /var/lib/kr0ki/capabilities/capabilities.json
      ports:
        - containerPort: 8000
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 2
        failureThreshold: 30
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
      volumeMounts:
        - name: kr0ki-capabilities
          mountPath: /var/lib/kr0ki/capabilities
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    - name: kr0ki
      image: localhost/kr0ki-server:dev
      imagePullPolicy: Never
      env:
        - name: KR0KI_BIND
          value: 0.0.0.0:8787
        - name: KR0KI_BACKEND_URL
          value: http://127.0.0.1:8000
        - name: KR0KI_CACHE_DIR
          value: /var/lib/kr0ki/cache
        - name: KR0KI_PLAYBOOK_DIR
          value: /usr/share/kr0ki-playbook
        # kr0ki#20 — the kroki container's own self-reported companion status,
        # written to this same shared volume at its startup.
        - name: KR0KI_CAPABILITIES_PATH
          value: /var/lib/kr0ki/capabilities/capabilities.json
        # mcp-http-parity design, 2026-09-16 — the kr0ki-mcp sidecar's
        # internal KubeDiagrams-rendering listener, reachable over the pod's
        # shared network namespace exactly like KR0KI_BACKEND_URL is.
        - name: KR0KI_KUBEDIAGRAM_WORKER_URL
          value: http://127.0.0.1:8788
        # Optional: without a configured read-only SysML v2 server, /model/*
        # deliberately returns 503 instead of inventing a backend.
        - name: KR0KI_SYSMLV2_BASE_URL
          value: ""
      ports:
        - containerPort: 8787
          hostPort: 8787
      readinessProbe:
        httpGet:
          path: /health
          port: 8787
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 2
        failureThreshold: 15
      resources:
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: kr0ki-cache
          mountPath: /var/lib/kr0ki/cache
        - name: kr0ki-capabilities
          mountPath: /var/lib/kr0ki/capabilities
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
    - name: kr0ki-mcp
      image: localhost/kr0ki-mcp:dev
      imagePullPolicy: Never
      env:
        - name: KR0KI_URL
          value: http://127.0.0.1:8787
      ports:
        - containerPort: 8788
      readinessProbe:
        httpGet:
          path: /health
          port: 8788
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 2
        failureThreshold: 15
      resources:
        limits:
          cpu: "250m"
          memory: 128Mi
      volumeMounts:
        - name: kubediagram-tmp
          mountPath: /tmp
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
    - name: kr0ki-storyb00k-agent
      image: localhost/kr0ki-storyb00k-agent:dev
      imagePullPolicy: Never
      env:
        - name: KR0KI_URL
          value: http://127.0.0.1:8787
        - name: OPENAI_API_KEY
          value: unused-local-llamacpp-key
        - name: OPENAI_API_URL
          # This host daemon is outside the pod network namespace. The local k0s
          # node address is intentionally deployment configuration, never code.
          value: http://192.168.1.137:8001/v1
        - name: KR0KI_STORYB00K_ALLOWED_ORIGINS
          value: http://localhost:8787,http://192.168.1.137:8787
      ports:
        - containerPort: 8789
          hostPort: 8789
      readinessProbe:
        httpGet:
          path: /health
          port: 8789
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 2
        failureThreshold: 15
      resources:
        limits:
          cpu: "250m"
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
  volumes:
    - name: kr0ki-cache
      emptyDir: {}
    - name: kubediagram-tmp
      emptyDir: {}
    - name: kr0ki-capabilities
      emptyDir: {}
