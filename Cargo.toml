# kr0ki workspace.
# P0 (this): the decision-independent render loop — Kroki-family text -> SVG, with
# content-addressed caching. The SysML-model-ingestion path (ufo-types / systhread-core /
# holon-viz) is deliberately absent — it's blocked on PRD-KR0KI-001 §5 decisions D1-D6.

[workspace]
resolver = "2"
members = ["crates/kr0ki-core", "crates/kr0ki-server"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/PromptExecution/kr0ki"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
