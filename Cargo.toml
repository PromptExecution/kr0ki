# kr0ki workspace.
# P0: the decision-independent render loop — Kroki-family text -> SVG, with
# content-addressed caching (kr0ki-core / kr0ki-server).
# SysML-model-ingestion path: kr0ki-sysmlv2-client — a generic OMG "Systems Modeling
# API and Services" REST client (D3 resolved 2026-09-05: kr0ki *consumes* an upstream
# OMG-API model server, it does not host the model). kr0ki-core additionally builds box
# 2 of the five-box pipeline (the canonical UFO semantic graph, ufo-types v0.14.0
# pinned) from a ModelSnapshot (SysML-v2 arm) or from raw Kubernetes manifests via the
# kr0ki#12 recognizer (k8s_recognizer.rs, ported from vendor/kubediagrams). That UFO
# graph now lifts into ufo_types::sysml_model::Relation via sysml_lift.rs
# (PATTERNS-kubernetes.md §4), rendered as D2/Mermaid via sysml_render.rs (FR1) — the
# Kubernetes arm is wired end-to-end behind POST /render/k8s-topology. See
# docs/PLAN-KR0KI-002.md. A separate box-5 arm, kr0ki#13's b00t-graph route
# (b00t_graph.rs), reads an already-built elasticdotventures/_b00t_ Turtle graph and
# renders it straight to D2 via holon-viz (git-rev-pinned; D1/D2/D3/D6 all resolved —
# docs/PRD-KR0KI-001-foundational.md §5).

[workspace]
resolver = "2"
members = ["crates/kr0ki-core", "crates/kr0ki-server", "crates/kr0ki-sysmlv2-client"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/PromptExecution/kr0ki"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
