# kr0ki workspace.
# P0: the decision-independent render loop — Kroki-family text -> SVG, with
# content-addressed caching (kr0ki-core / kr0ki-server).
# First SysML-model-ingestion increment: kr0ki-sysmlv2-client — a generic OMG "Systems
# Modeling API and Services" REST client (D3 resolved 2026-09-05: kr0ki *consumes* an
# upstream OMG-API model server, it does not host the model). The typed adapter above
# ModelSnapshot, and anything touching ufo-types / systhread-core / holon-viz, stays
# blocked on PRD-KR0KI-001 §5 decisions D1/D6 — see docs/PLAN-KR0KI-002.md.

[workspace]
resolver = "2"
members = ["crates/kr0ki-core", "crates/kr0ki-server", "crates/kr0ki-sysmlv2-client"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/PromptExecution/kr0ki"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
