[package]
name = "rust-behavior-extractor"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
kr0ki-behavior = { path = "../../crates/kr0ki-behavior" }
serde_json = "1"
sha2 = "0.10"
syn = { version = "=2.0.119", features = ["full", "visit", "parsing"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
toml = "=0.8.23"

[package.metadata.rust-analyzer]
rustc_private = true
