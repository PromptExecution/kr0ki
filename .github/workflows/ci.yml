name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  compiler-extractor:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      # This standalone workspace is intentionally excluded from stable CI.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
          components: rustc-dev, rust-src, rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/rust-behavior-extractor -> target
      - run: cargo fmt --manifest-path tools/rust-behavior-extractor/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tools/rust-behavior-extractor/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tools/rust-behavior-extractor/Cargo.toml -- --test-threads=1

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: playbook/pnpm-lock.yaml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # KR-A07's sandbox cases run under bubblewrap and fail (by design) without it.
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / true
      - run: cargo test --workspace
      - name: kr0ki-mcp Python tests
        run: |
          cd containers/kr0ki-mcp
          python3 test_bridge.py
          python3 test_http_worker.py
      - name: kr0ki-storyb00k-agent Python tests
        run: |
          cd containers/kr0ki-storyb00k-agent
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python3 -m unittest discover -p 'test_*.py' -v
      # `pnpm run build` is deliberately not run here: it would need the
      # vendored @assistant-ui/vue package's dist/ built, which requires
      # installing the entire elasticdotventures/assistant-ui monorepo
      # (2,347 packages, ~2GB) for one small package -- not yet worth the
      # CI cost (PR #37 review). The one test file that needs that dist/
      # is excluded here via playbook/vite.config.js's CI-conditional
      # exclude; it still runs for local developers who've built it.
      - name: playbook (Vue) tests
        run: |
          pnpm --dir playbook install --frozen-lockfile
          pnpm --dir playbook test
      - name: lsp-bridge tests
        run: |
          pnpm --dir tools/lsp-bridge install --frozen-lockfile
          pnpm --dir tools/lsp-bridge test
      - name: sysml-mcp sidecar tests
        run: |
          pnpm --dir containers/kr0ki-sysml-mcp install --frozen-lockfile
          pnpm --dir containers/kr0ki-sysml-mcp test

  # SysML-v2-Release conformance harness (phase 1). Runs in parallel with
  # `check` and does not block it: the corpus fetch (~110 MB tarball) and the
  # ignored conformance tests are slower and network-dependent. See
  # docs/CONFORMANCE.md.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache SysML-v2-Release corpus
        uses: actions/cache@v4
        with:
          path: ./.sysml-v2-release
          key: sysml-v2-release-${{ hashFiles('docs/conformance-target.toml') }}
      - run: bash scripts/fetch-sysml-v2-release.sh
      - run: cargo test -p kr0ki-core --test conformance -- --ignored --nocapture
